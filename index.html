<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NORTHLINE | Clothing</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #111; font-family: Inter, sans-serif; }
    button, input, select { font-family: inherit; }
    header { background: #111; color: #fff; display: flex; align-items: center; gap: 18px; padding: 12px 20px; }
    .logo { font-weight: 700; letter-spacing: .2em; font-size: 18px; }
    .search { flex: 1; background: #fff; color: #111; border: 0; border-radius: 20px; padding: 10px 14px; }
    header button { background: none; color: #fff; border: 0; cursor: pointer; }
    .menu { display: flex; gap: 22px; padding: 12px 20px; border-bottom: 1px solid #e5e5e5; font-size: 14px; font-weight: 600; }
    .toolbar { display: flex; justify-content: space-between; padding: 14px 20px; font-size: 13px; color: #444; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 0 16px 40px; }
    .tile { background: #f6f6f6; }
    .tile img { width: 100%; height: 320px; object-fit: cover; display: block; }
    .pad { padding: 8px 8px 12px; background: #fff; }
    .name { font-size: 13px; margin: 0 0 4px; }
    .sale { color: #d01345; font-weight: 700; }
    .old { color: #888; text-decoration: line-through; margin-right: 6px; font-weight: 400; }
    select { width: 100%; margin-top: 8px; padding: 6px; }
    .add { margin-top: 8px; width: 100%; background: #111; color: #fff; border: 0; padding: 8px; cursor: pointer; }
    .sheet { max-width: 760px; margin: 24px auto; padding: 0 16px 40px; }
    .row { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 12px 0; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } .menu { overflow: auto; } }
  </style>
</head>
<body>
  <header>
    <div class="logo">NORTHLINE</div>
    <input class="search" placeholder="Search clothes, shoes, coats" />
    <button data-go="shop">New in</button>
    <button id="loginBtn">Account</button>
    <button id="cartBtn">Bag <span id="count">0</span></button>
  </header>
  <div class="menu"><span>New in</span><span>Clothing</span><span>Dresses</span><span>Shoes</span><span>Coats</span><span>Sale</span></div>
  <main id="app"></main>
  <script>
    const products = [
      ["c1","Wool overcoat","https://images.unsplash.com/photo-1539533018447-63fcce2678e3?auto=format&fit=crop&w=800&q=80",180,129],
      ["c2","Linen shirt","https://images.unsplash.com/photo-1434389677669-e08b4cac3105?auto=format&fit=crop&w=800&q=80",42,42],
      ["c3","Straight trouser","https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?auto=format&fit=crop&w=800&q=80",55,39],
      ["c4","Tailored blazer","https://images.unsplash.com/photo-1591369822096-ffd140ec948f?auto=format&fit=crop&w=800&q=80",120,89],
      ["c5","Slip dress","https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=800&q=80",68,49],
      ["c6","Leather court shoe","https://images.unsplash.com/photo-1543163521-1bf539c55dd2?auto=format&fit=crop&w=800&q=80",75,75],
      ["c7","Day dress","https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=800&q=80",58,45],
      ["c8","Studio look","https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=800&q=80",36,29]
    ].map(([id,name,img,old,now])=>({id,name,img,old,now}));
    const key="northline-v3";
    const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(key+k))??d}catch{return d}};
    const write=(k,v)=>localStorage.setItem(key+k,JSON.stringify(v));
    let cart=read("c",[]), user=read("u",null), orders=read("o",[]), view="home";
    const money=n=>"£"+n.toFixed(2);
    const find=id=>products.find(p=>p.id===id);
    const app=document.getElementById("app");
    const go=v=>{view=v;draw()};
    document.getElementById("cartBtn").onclick=()=>go("cart");
    document.getElementById("loginBtn").onclick=()=>go(user?"account":"login");
    function tile(p){return `<article class="tile"><img src="${p.img}" alt=""><div class="pad"><p class="name">${p.name}</p><p class="sale">${p.old!==p.now?`<span class="old">${money(p.old)}</span>`:""}${money(p.now)}</p><select id="s-${p.id}"><option>UK 8</option><option selected>UK 10</option><option>UK 12</option><option>UK 14</option></select><button class="add" data-add="${p.id}">ADD</button></div></article>`}
    function draw(){
      document.getElementById("count").textContent=cart.reduce((s,i)=>s+i.qty,0);
      document.getElementById("loginBtn").textContent=user?user.name:"Account";
      const pages={home,shop,cart:cartView,checkout,orders:ordersView,login,account};
      app.innerHTML=pages[view]();
      document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
      document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{
        const size=document.getElementById("s-"+b.dataset.add).value;
        const hit=cart.find(x=>x.id===b.dataset.add&&x.size===size);
        if(hit)hit.qty++; else cart.push({id:b.dataset.add,size,qty:1});
        write("c",cart); draw();
      });
      document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.del,1);write("c",cart);draw()});
      const pay=document.getElementById("pay");
      if(pay)pay.onclick=()=>{orders.unshift({items:cart.map(i=>find(i.id).name+" "+i.size), total:cart.reduce((s,i)=>s+find(i.id).now*i.qty,0)});write("o",orders);cart=[];write("c",cart);go("orders")};
      const enter=document.getElementById("enter");
      if(enter)enter.onclick=()=>{const name=document.getElementById("nm").value.trim(); if(!name)return; user={name}; write("u",user); go("shop")};
      const out=document.getElementById("out");
      if(out)out.onclick=()=>{user=null;write("u",null);go("home")};
    }
    function home(){return `<div class="toolbar"><span>${products.length} styles</span><span>Sort: Price low to high</span></div><div class="grid">${products.map(tile).join("")}</div>`}
    function shop(){return home()}
    function cartView(){if(!cart.length)return `<div class="sheet"><h2>Nothing in your bag</h2><button class="add" data-go="shop">Shop new in</button></div>`; const total=cart.reduce((s,i)=>s+find(i.id).now*i.qty,0); return `<div class="sheet"><h2>Bag</h2>${cart.map((i,idx)=>`<div class="row"><div>${find(i.id).name}<br>${i.size} × ${i.qty}</div><div>${money(find(i.id).now*i.qty)}<br><button data-del="${idx}">Remove</button></div></div>`).join("")}<p><b>${money(total)}</b></p><button class="add" data-go="checkout">CHECKOUT</button></div>`}
    function checkout(){if(!user)return `<div class="sheet"><h2>Sign in first</h2><button class="add" data-go="login">Account</button></div>`; return `<div class="sheet"><h2>Demo payment</h2><input value="4242 4242 4242 4242"><p>No charge is made.</p><button class="add" id="pay">PAY NOW</button></div>`}
    function ordersView(){if(!orders.length)return `<div class="sheet"><h2>No orders</h2></div>`; return `<div class="sheet"><h2>Orders</h2>${orders.map(o=>`<div class="row"><span>${o.items.join(", ")}</span><b>${money(o.total)}</b></div>`).join("")}</div>`}
    function login(){return `<div class="sheet"><h2>Account</h2><input id="nm" placeholder="Name"><button class="add" id="enter">Continue</button></div>`}
    function account(){return `<div class="sheet"><h2>${user.name}</h2><button class="add" id="out">Sign out</button></div>`}
    document.querySelectorAll("header [data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
    draw();
  </script>
</body>
</html>
