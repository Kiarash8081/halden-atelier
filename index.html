<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>نورث‌لاین | لباس</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #111; font-family: Tahoma, "Segoe UI", sans-serif; }
    button, input, select { font-family: inherit; }
    header { background: #111; color: #fff; display: flex; align-items: center; gap: 18px; padding: 12px 20px; }
    .logo { font-weight: 700; letter-spacing: .2em; font-size: 18px; }
    .search { flex: 1; background: #fff; color: #111; border: 0; border-radius: 20px; padding: 10px 14px; }
    header button { background: none; color: #fff; border: 0; cursor: pointer; }
    .menu { display: flex; gap: 22px; padding: 12px 20px; border-bottom: 1px solid #e5e5e5; font-size: 14px; font-weight: 600; }
    .toolbar { display: flex; justify-content: space-between; padding: 14px 20px; font-size: 13px; color: #444; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 0 16px 40px; }
    .tile { background: #f6f6f6; }
    .tile img { width: 100%; height: 320px; object-fit: cover; display: block; }
    .pad { padding: 8px 8px 12px; background: #fff; }
    .name { font-size: 13px; margin: 0 0 4px; }
    .sale { color: #d01345; font-weight: 700; }
    .old { color: #888; text-decoration: line-through; margin-right: 6px; font-weight: 400; }
    select { width: 100%; margin-top: 8px; padding: 6px; }
    .add { margin-top: 8px; width: 100%; background: #111; color: #fff; border: 0; padding: 8px; cursor: pointer; }
    .sheet { max-width: 760px; margin: 24px auto; padding: 0 16px 40px; }
    .row { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 12px 0; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } .menu { overflow: auto; } }
    #intro { position: fixed; inset: 0; z-index: 20; background: #111; color: #fff; display: grid; place-items: center; transition: opacity .5s ease; }
    #intro.hide { opacity: 0; pointer-events: none; }
    #intro img { width: 84px; height: 84px; object-fit: cover; filter: invert(1); animation: pop .8s ease; }
    #intro b { display: block; letter-spacing: .35em; margin-top: 12px; font-weight: 700; }
    @keyframes pop { from { transform: scale(.86); opacity: 0; } to { transform: none; opacity: 1; } }
  </style>
</head>
<body>
  <div id="intro"><div><img src="img/northline-logo.jpg" alt=""><b>NORTHLINE</b></div></div>
  <header>
    <div class="logo">نورث‌لاین</div>
    <input class="search" placeholder="جستجوی لباس، کفش، پالتو" />
    <button data-go="shop">جدید</button>
    <button id="loginBtn">حساب</button>
    <button id="cartBtn">سبد <span id="count">0</span></button>
  </header>
  <div class="menu"><span>جدید</span><span>لباس</span><span>پیراهن</span><span>کفش</span><span>پالتو</span><span>حراج</span></div>
  <main id="app"></main>
  <script>
    const products = [
      ["c1","پالتو پشمی","img/cloth-coat.jpg",8900000,6450000],
      ["c2","پیراهن کتان","img/cloth-shirt.jpg",1450000,1450000],
      ["c3","شلوار راست","img/cloth-trouser.jpg",1890000,1390000],
      ["c4","کت بلیزر","img/cloth-blazer.jpg",4200000,3150000]
    ].map(([id,name,img,old,now])=>({id,name,img,old,now}));
    const key="northline-v3";
    const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(key+k))??d}catch{return d}};
    const write=(k,v)=>localStorage.setItem(key+k,JSON.stringify(v));
    let cart=read("c",[]), user=read("u",null), orders=read("o",[]), view="home";
    const money=n=>new Intl.NumberFormat("fa-IR").format(n)+" تومان";
    setTimeout(()=>document.getElementById("intro").classList.add("hide"), 1600);
    const find=id=>products.find(p=>p.id===id);
    const app=document.getElementById("app");
    const go=v=>{view=v;draw()};
    document.getElementById("cartBtn").onclick=()=>go("cart");
    document.getElementById("loginBtn").onclick=()=>go(user?"account":"login");
    function tile(p){return `<article class="tile"><img src="${p.img}" alt="${p.name}"><div class="pad"><p class="name">${p.name}</p><p class="sale">${p.old!==p.now?`<span class="old">${money(p.old)}</span>`:""}${money(p.now)}</p><select id="s-${p.id}"><option>۳۶</option><option selected>۳۸</option><option>۴۰</option><option>۴۲</option></select><button class="add" data-add="${p.id}">افزودن</button></div></article>`}
    function draw(){
      document.getElementById("count").textContent=cart.reduce((s,i)=>s+i.qty,0);
      document.getElementById("loginBtn").textContent=user?user.name:"حساب";
      const pages={home,shop,cart:cartView,checkout,orders:ordersView,login,account};
      app.innerHTML=pages[view]();
      document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
      document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{
        const size=document.getElementById("s-"+b.dataset.add).value;
        const hit=cart.find(x=>x.id===b.dataset.add&&x.size===size);
        if(hit)hit.qty++; else cart.push({id:b.dataset.add,size,qty:1});
        write("c",cart); draw();
      });
      document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.del,1);write("c",cart);draw()});
      const pay=document.getElementById("pay");
      if(pay)pay.onclick=()=>{orders.unshift({items:cart.map(i=>find(i.id).name+" "+i.size), total:cart.reduce((s,i)=>s+find(i.id).now*i.qty,0)});write("o",orders);cart=[];write("c",cart);go("orders")};
      const enter=document.getElementById("enter");
      if(enter)enter.onclick=()=>{const name=document.getElementById("nm").value.trim(); if(!name)return; user={name}; write("u",user); go("shop")};
      const out=document.getElementById("out");
      if(out)out.onclick=()=>{user=null;write("u",null);go("home")};
    }
    function home(){return `<div class="toolbar"><span>${products.length} مدل</span><span>مرتب‌سازی: ارزان‌تر</span></div><div class="grid">${products.map(tile).join("")}</div>`}
    function shop(){return home()}
    function cartView(){if(!cart.length)return `<div class="sheet"><h2>سبد خالی است</h2><button class="add" data-go="shop">دیدن لباس‌ها</button></div>`; const total=cart.reduce((s,i)=>s+find(i.id).now*i.qty,0); return `<div class="sheet"><h2>سبد</h2>${cart.map((i,idx)=>`<div class="row"><div>${find(i.id).name}<br>${i.size} × ${i.qty}</div><div>${money(find(i.id).now*i.qty)}<br><button data-del="${idx}">حذف</button></div></div>`).join("")}<p><b>${money(total)}</b></p><button class="add" data-go="checkout">پرداخت</button></div>`}
    function checkout(){if(!user)return `<div class="sheet"><h2>اول وارد شوید</h2><button class="add" data-go="login">حساب</button></div>`; return `<div class="sheet"><h2>پرداخت آزمایشی</h2><input value="6037 0000 0000 4411"><p>مبلغی کم نمی‌شود.</p><button class="add" id="pay">پرداخت</button></div>`}
    function ordersView(){if(!orders.length)return `<div class="sheet"><h2>سفارشی نیست</h2></div>`; return `<div class="sheet"><h2>سفارش‌ها</h2>${orders.map(o=>`<div class="row"><span>${o.items.join("، ")}</span><b>${money(o.total)}</b></div>`).join("")}</div>`}
    function login(){return `<div class="sheet"><h2>حساب</h2><input id="nm" placeholder="نام"><button class="add" id="enter">ادامه</button></div>`}
    function account(){return `<div class="sheet"><h2>${user.name}</h2><button class="add" id="out">خروج</button></div>`}
    document.querySelectorAll("header [data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
    draw();
  </script>
</body>
</html>
